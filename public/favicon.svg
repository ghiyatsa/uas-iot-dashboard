<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for Shield Base -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <!-- Gradient for Inner Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Border & Base -->
  <path d="M256,40 C376.6,80 432,120 432,120 C432,260 360,370 256,472 C152,370 80,260 80,120 C80,120 135.4,80 256,40 Z" 
        fill="url(#shieldGrad)" 
        stroke="#065f46" 
        stroke-width="12" 
        stroke-linejoin="round" />
  
  <!-- Inner Glow Shield -->
  <path d="M256,64 C352,100 396,132 396,132 C396,244 338,332 256,420 C174,332 116,244 116,132 C116,132 160,100 256,64 Z" 
        fill="url(#glowGrad)" />

  <!-- Home / Building Shape -->
  <path d="M256,150 L350,230 L350,330 C350,341 341,350 330,350 L182,350 C171,350 162,341 162,330 L162,230 Z" 
        fill="#ffffff" 
        opacity="0.95" />

  <!-- Heart / Safety Icon inside the Home -->
  <path d="M256,290 C256,290 230,270 230,250 C230,238 238,230 250,230 C254,230 256,234 256,234 C256,234 258,230 262,230 C274,230 282,238 282,250 C282,270 256,290 256,290 Z" 
        fill="#dc2626" />
</svg>